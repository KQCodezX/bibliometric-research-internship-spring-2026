name: Analysis tests
on: [push, pull_request, workflow_dispatch]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install .
      - run: python -m unittest discover -s tests -v
      - uses: r-lib/actions/setup-r@v2
      - run: python -m validation.check_reference
      - run: Rscript -e 'install.packages("igraph", repos="https://cloud.r-project.org")'
      - run: python -m validation.check_network
      - run: python -m analysis annual --output annual.json
      - run: python -m analysis regression --output regression.json
      - run: python -m analysis network --output network.json
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: analysis-results
          path: |
            validation-report.json
            annual.json
            regression.json
            network.json
            network-validation.json
